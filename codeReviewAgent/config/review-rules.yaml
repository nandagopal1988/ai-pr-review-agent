rules:
  # Security Rules
  - id: hardcoded_credentials
    name: Hardcoded Credentials
    description: Detects hardcoded passwords, API keys, and tokens
    pattern: '(password|secret|api_key|token|credentials)\s*[=:]\s*["\'][\w\-\.]+["\']'
    severity: critical
    languages: [java, python, typescript, javascript, csharp, go]
    enabled: true
    fixable: false

  - id: sql_injection_risk
    name: SQL Injection Risk
    description: Detects potential SQL injection vulnerabilities
    pattern: '(query|execute|sql)\s*\(\s*["\'][^"\']*\$\{|(\+|\s)\w+\s*\+|String\.format.*sql'
    severity: critical
    languages: [java, python, typescript, javascript]
    enabled: true
    fixable: false

  - id: insecure_deserialization
    name: Insecure Deserialization
    description: Detects insecure object deserialization
    pattern: '(ObjectInputStream|pickle\.load|JSON\.parse.*eval|yaml\.load)'
    severity: critical
    languages: [java, python, javascript]
    enabled: true
    fixable: false

  # Spring Boot Specific Rules
  - id: spring_boot_security_missing
    name: Missing Spring Security Configuration
    description: Spring Boot application without security configuration
    pattern: '@SpringBootApplication|public class.*Application'
    severity: high
    languages: [java]
    enabled: true
    fixable: false

  - id: spring_boot_actuator_exposed
    name: Spring Boot Actuator Exposed
    description: Actuator endpoints may be exposed without authentication
    pattern: 'management\.endpoints\.web\.exposure\.include|actuator'
    severity: high
    languages: [java]
    enabled: true
    fixable: false

  - id: spring_boot_properties_exposed
    name: Sensitive Spring Boot Properties in Code
    description: Sensitive configuration exposed in application.properties or application.yml
    pattern: 'spring\.(datasource|jpa|security)\.password|server\.ssl\.key-store-password'
    severity: critical
    languages: [java]
    enabled: true
    fixable: false

  - id: spring_boot_transaction_missing
    name: Missing Transaction Management
    description: Database operations without proper transaction management
    pattern: '(save|delete|update|persist)\(|@Repository'
    severity: medium
    languages: [java]
    enabled: true
    fixable: false

  - id: spring_boot_logging_best_practice
    name: Logging Best Practice Violation
    description: System.out/err used instead of logger
    pattern: 'System\.(out|err)\.(println|print)'
    severity: warning
    languages: [java]
    enabled: true
    fixable: true

  # Code Quality Rules
  - id: large_method
    name: Large Method/Function
    description: Methods or functions exceeding 50 lines
    pattern: '(public|private|protected)\s+(static\s+)?(async\s+)?(function|def|void|int|string|boolean)\s+\w+\s*\('
    severity: warning
    languages: [java, python, typescript, javascript, csharp]
    conditions:
      lines_of_code: '> 50'
    enabled: true
    fixable: false

  - id: deep_nesting
    name: Deep Nesting
    description: Code with nesting level > 4
    pattern: 'if|for|while|switch'
    severity: warning
    languages: [java, python, typescript, javascript, csharp]
    conditions:
      nesting_level: '> 4'
    enabled: true
    fixable: false

  - id: missing_error_handling
    name: Missing Error Handling
    description: Methods that don't handle exceptions
    pattern: '(throw|raise|async function|def\s+\w+\(.*\):)'
    severity: medium
    languages: [java, python, typescript, javascript]
    enabled: true
    fixable: false

  - id: unused_imports
    name: Unused Imports
    description: Detects unused import statements
    pattern: '(import|from|require)\s+["\']'
    severity: info
    languages: [java, python, typescript, javascript]
    enabled: true
    fixable: true

  # Testing Rules
  - id: missing_test_coverage
    name: Missing Test Coverage
    description: New public methods without tests
    pattern: 'public\s+(static\s+)?(synchronized\s+)?(final\s+)?(\w+)\s+(\w+)\s*\('
    severity: warning
    languages: [java, typescript, javascript, csharp]
    conditions:
      has_test: 'false'
      is_public: 'true'
    enabled: true
    fixable: false

  - id: hardcoded_test_data
    name: Hardcoded Test Data
    description: Test methods with hardcoded values instead of fixtures
    pattern: '(@Test|def test_|test\s*\(|it\()'
    severity: info
    languages: [java, python, typescript, javascript]
    enabled: true
    fixable: false

  # Naming Convention Rules
  - id: inconsistent_naming
    name: Inconsistent Naming Convention
    description: Variables and methods not following naming standards
    pattern: '(let|var|const|private|public)\s+([a-z][a-z0-9]*_[a-z0-9]+|[A-Z][a-zA-Z0-9]+(?<![A-Z]))'
    severity: info
    languages: [java, typescript, javascript, csharp]
    enabled: true
    fixable: false

  - id: non_descriptive_variable_names
    name: Non-Descriptive Variable Names
    description: Single letter or very short variable names (except loop counters)
    pattern: '(let|var|const|int|string|boolean)\s+[a-z]{1}(?!\w*for)'
    severity: info
    languages: [java, typescript, javascript, python, csharp]
    enabled: true
    fixable: false

  # Performance Rules
  - id: inefficient_loop
    name: Inefficient Loop Pattern
    description: Detects inefficient loop patterns
    pattern: 'for\s*\(\s*int\s+\w+\s*=\s*0\s*;\s*\w+\s*<\s*\w+\.length\s*;\s*\w+\+\+\s*\)\s*{\s*\w+\.get\('
    severity: warning
    languages: [java, typescript, javascript]
    enabled: true
    fixable: true

  - id: string_concatenation_in_loop
    name: String Concatenation in Loop
    description: Using + for string concatenation in loops (use StringBuilder/join)
    pattern: 'for\s*\(.*\)\s*{\s*[^}]*([\w\s]*\+\s*["\']|["\'].*\+)[^}]*}'
    severity: medium
    languages: [java, typescript, javascript]
    enabled: true
    fixable: true

  - id: repeated_database_calls
    name: Repeated Database Calls
    description: Same query executed multiple times in a loop
    pattern: 'for\s*\(.*\)\s*{\s*[^}]*(query|fetch|select|findBy)[^}]*}'
    severity: medium
    languages: [java, typescript, javascript, python]
    enabled: true
    fixable: false

# Coverage Rules
coverage:
  minimum_for_new_code: 80
  minimum_for_modified_code: 85
  minimum_overall: 70

# Complexity Rules
complexity:
  cyclomatic_complexity_threshold: 10
  cognitive_complexity_threshold: 15

# Rule Groups for Quick Filtering
rule_groups:
  security: [hardcoded_credentials, sql_injection_risk, insecure_deserialization]
  quality: [large_method, deep_nesting, missing_error_handling, unused_imports]
  testing: [missing_test_coverage, hardcoded_test_data]
  performance: [inefficient_loop, string_concatenation_in_loop, repeated_database_calls]
  naming: [inconsistent_naming, non_descriptive_variable_names]

# Rule Severity Levels
severity_levels:
  critical:
    color: red
    block_merge: true
    must_fix: true
  high:
    color: orange
    block_merge: false
    must_fix: true
  medium:
    color: yellow
    block_merge: false
    must_fix: false
  warning:
    color: blue
    block_merge: false
    must_fix: false
  info:
    color: green
    block_merge: false
    must_fix: false
